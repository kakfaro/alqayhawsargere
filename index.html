<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نیشاندانی تایبەت</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* شاردنەوەی سەرەتایی هەموو بەشەکان */
    .step {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* چالاککردنی بەشەکان */
    .step.active {
      opacity: 1;
      visibility: visible;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ئەنیمەیشنی وێنەی دووەم */
    .animated-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: zoomAndRotate 5s linear forwards;
    }

    @keyframes zoomAndRotate {
      0% {
        transform: scale(1) rotate(0deg);
        filter: brightness(1);
      }
      50% {
        transform: scale(1.1) rotate(1deg);
        filter: brightness(1.2);
      }
      100% {
        transform: scale(1.2) rotate(0deg);
        filter: brightness(1);
      }
    }

    /* شێوازی قۆناغی کۆتایی */
    .final-step {
      flex-direction: column;
      justify-content: flex-end;
      text-align: center;
    }

    .final-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .overlay-text {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 30px 20px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      font-size: 1.2rem;
      line-height: 1.8;
      color: #ffe6eb;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="step active" id="step1">
      <video id="vid1" autoplay muted playsinline>
        <source src="https://raw.githubusercontent.com/kakfaro/alqayhawsargere/main/v1c044g50000dahjh1nog65n3ivibs60.mp4" type="video/mp4">
      </video>
    </div>

    <div class="step" id="step2">
      <video id="vid2" muted playsinline>
        <source src="https://raw.githubusercontent.com/kakfaro/alqayhawsargere/main/b_please_make_vedio_An.mp4" type="video/mp4">
      </video>
    </div>

    <div class="step" id="step3">
      <img src="https://raw.githubusercontent.com/kakfaro/alqayhawsargere/main/IMG_0013.jpeg" class="animated-img" alt="Animation">
    </div>

    <div class="step final-step" id="step4">
      <img src="https://raw.githubusercontent.com/kakfaro/alqayhawsargere/main/IMG_0011.jpeg" class="final-bg" alt="Final Image">
      <div class="overlay-text">
        تۆ جوانترین دیاری ژیانمی، لەگەڵ تۆدا هەموو چرکەیەک ڕەنگی خۆشەویستی دەگرێت... ❤️
      </div>
    </div>
  </div>

  <script>
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const step4 = document.getElementById('step4');

    const vid1 = document.getElementById('vid1');
    const vid2 = document.getElementById('vid2');

    // دوای 5 چرکە لە دەستپێکردن: ڕاهێنانی قۆناغی دووەم
    setTimeout(() => {
      step1.classList.remove('active');
      step2.classList.add('active');
      vid2.play();
    }, 5000);

    // دوای 10 چرکە (5 چرکەی ڤیدیۆی دووەم): ڕاهێنانی وێنەی ئەنیمەیشن
    setTimeout(() => {
      step2.classList.remove('active');
      step3.classList.add('active');
    }, 10000);

    // دوای 15 چرکە (5 چرکەی وێنەی ئەنیمەیشن): چوون بۆ وێنەی کۆتایی و دەق
    setTimeout(() => {
      step3.classList.remove('active');
      step4.classList.add('active');
    }, 15000);
  </script>

</body>
</html>
