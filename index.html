<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەڕەی ڕۆمانسی</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* کارپێکەری دەنگەکە */
        audio {
            display: none;
        }

        /* کۆنتێنەری بەشەکان */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* بەشی ۱: ڤیدیۆکەی یەکەم */
        #video-stage {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 3;
            transition: opacity 1s ease-in-out;
        }

        /* بەشی ۲: وێنەی دووەم بە ئەنیبەیشن */
        #image1-stage {
            position: absolute;
            max-width: 90%;
            max-height: 80%;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
            opacity: 0;
            transform: scale(0.5) rotate(-10deg);
            z-index: 2;
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #image1-stage.animate {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* بەشی ۳: وێنەی کۆتایی و دەقەکە */
        #final-stage {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 1;
            transition: opacity 1.5s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        #final-stage.show {
            opacity: 1;
        }

        .bg-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* چینی تاریککردن بۆ باشتر دیاربوونی دەقەکە */
        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0) 100%);
            z-index: 0;
        }

        .romantic-text {
            position: relative;
            z-index: 1;
            color: #ffffff;
            font-size: 1.4rem;
            text-align: center;
            padding: 20px;
            margin-bottom: 40px;
            line-height: 1.6;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <audio id="bg-audio" autoplay loop>
        <source src="https://raw.githubusercontent.com/kakfaro/alqayhawsargere/main/v1c044g50000dahjh1nog65n3ivibs60.mp4" type="audio/mp4">
    </audio>

    <div class="container">
        <video id="video-stage" autoplay muted playsinline>
            <source src="https://raw.githubusercontent.com/kakfaro/alqayhawsargere/main/b_please_make_vedio_An.mp4" type="video/mp4">
        </video>

        <img id="image1-stage" src="https://raw.githubusercontent.com/kakfaro/alqayhawsargere/main/IMG_0013.jpeg" alt="وێنەی ئەنیمەیشن">

        <div id="final-stage">
            <img class="bg-image" src="https://raw.githubusercontent.com/kakfaro/alqayhawsargere/main/IMG_0011.jpeg" alt="وێنەی کۆتایی">
            <div class="overlay"></div>
            <p class="romantic-text">
                "تۆ قەشەنگترین ڕووداوی ژیانی منیت، <br>لەگەڵ تۆدا هەموو چرکەیەک مانا بە ژیان دەبەخشێت..."
            </p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const audio = document.getElementById("bg-audio");
            const videoStage = document.getElementById("video-stage");
            const image1Stage = document.getElementById("image1-stage");
            const finalStage = document.getElementById("final-stage");

            // هەوڵدان بۆ لێدانی دەنگ
            audio.play().catch(() => {
                // ئەگەر وێبگەڕ ڕێگەی نەدا خۆکار لێبدرێت، بە لێدانی یەکەم کلیل دەستپێدەکات
                document.body.addEventListener('click', () => audio.play(), { once: true });
            });

            // دوای ۵ چرکە: شاردنەوەی ڤیدیۆ و نیشاندانی وێنەی ۲ بە ئەنیمەیشن
            setTimeout(() => {
                videoStage.style.opacity = '0';
                setTimeout(() => { videoStage.style.display = 'none'; }, 1000);
                
                image1Stage.classList.add('animate');
            }, 5000);

            // دوای ۱۰ چرکە (۵ چرکەی ڤیدیۆ + ۵ چرکەی وێنەی دووەم): چوونی بۆ قۆناغی کۆتایی
            setTimeout(() => {
                image1Stage.style.opacity = '0';
                setTimeout(() => { image1Stage.style.display = 'none'; }, 1000);

                finalStage.classList.add('show');
            }, 10000);
        });
    </script>
</body>
</html>
