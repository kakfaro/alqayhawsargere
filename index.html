<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>یادگارییەکانمان</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0b0f;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      overflow: hidden;
    }

    /* شاردنەوەی بەشی دەنگ */
    audio {
      display: none;
    }

    /* ستاپ و ئۆپاسیتی بۆ بەشەکان */
    .step {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.5s ease-in-out, visibility 1.5s;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .step.active {
      opacity: 1;
      visibility: visible;
    }

    /* هەنگاوی 1: ڤیدیۆ */
    #step1 video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* هەنگاوی 2: وێنەی دووەم بە ئینیمەی شن */
    #step2 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: pulseZoom 5s infinite alternate ease-in-out;
    }

    @keyframes pulseZoom {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.1);
      }
    }

    /* هەنگاوی 3: وێنەی کۆتایی و دەق */
    #step3 {
      justify-content: flex-end;
    }

    #step3 img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .overlay-text {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 40px 20px 50px 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 70%, transparent 100%);
      text-align: center;
    }

    .overlay-text p {
      font-size: 1.25rem;
      line-height: 1.8;
      color: #f3e5f5;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      font-weight: 500;
    }

    /* دوگمەی دەستپێکردنی دەنگ بۆ ئەگەر براوسەر ڕێگەی نەدا */
    .start-btn {
      position: absolute;
      z-index: 10;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    <audio id="bg-music" src="https://github.com/kakfaro/alqayhawsargere/raw/main/v1c044g50000dahjh1nog65n3ivibs60.mov" loop preload="auto"></audio>

    <div class="step active" id="step1">
      <video id="intro-video" src="https://github.com/kakfaro/alqayhawsargere/raw/main/b_please_make_vedio_An.mp4" autoplay muted playsinline></video>
    </div>

    <div class="step" id="step2">
      <img src="https://github.com/kakfaro/alqayhawsargere/raw/main/IMG_0013.jpeg" alt="وێنەی دووەم">
    </div>

    <div class="step" id="step3">
      <img src="https://github.com/kakfaro/alqayhawsargere/raw/main/IMG_0011.jpeg" alt="وێنەی کۆتایی">
      <div class="overlay-text">
        <p>تۆ جوانترین دیاری بەخشراوی ژیانمی، لەگەڵ تۆدا هەموو چرکەیەک دەبێتە یادگارییەکی نەمر...</p>
      </div>
    </div>
  </div>

  <script>
    const music = document.getElementById('bg-music');
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');

    // لێدانی دەنگ لەگەڵ یەکەم کلیک/دەستپێکدا (بۆ تێپەڕاندنی یاسای Autoplayی براوسەرەکان)
    function startAudio() {
      music.play().catch(() => {});
      document.removeEventListener('click', startAudio);
      document.removeEventListener('touchstart', startAudio);
    }
    document.addEventListener('click', startAudio);
    document.addEventListener('touchstart', startAudio);

    window.addEventListener('DOMContentLoaded', () => {
      // هەوڵدان بۆ لێدانی ڕاستەوخۆی دەنگ
      music.play().catch(() => {});

      // دوای 5 چرکە بچۆ بۆ هەنگاوی دووەم
      setTimeout(() => {
        step1.classList.remove('active');
        step2.classList.add('active');

        // دوای 5 چرکەی تر (کۆی گشتی 10 چرکە) بچۆ بۆ هەنگاوی سێیەم
        setTimeout(() => {
          step2.classList.remove('active');
          step3.classList.add('active');
        }, 5000);

      }, 5000);
    });
  </script>
</body>
</html>
